version: 2

sources:
  - name: bronze_posthog
    database: "{{ target.project }}"
    schema: "{{ env_var('AIRFLOW_VAR_BQ_BRONZE_DATASET') }}"
    description: "Written by PostHog's hourly BigQuery export (project 315092). Read-only for us."
    config:
      tags: [ "posthog", "bronze" ]
      freshness:
        warn_after: {count: 30, period: hour}
        error_after: {count: 48, period: hour}

    tables:
      - name: posthog_events
        description: "Append-only, can contain duplicate uuids. Read it through int_posthog_events."
        config:
          loaded_at_field: bq_ingested_timestamp
          freshness:
            warn_after: {count: 30, period: hour}
            error_after: {count: 48, period: hour}
            filter: "timestamp >= timestamp_sub(current_timestamp(), interval 3 day)"

      - name: posthog_persons
        description: "One row per (team_id, distinct_id)."
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [team_id, distinct_id]
              config:
                severity: warn

      - name: posthog_sessions
        description: "One row per (team_id, session_id)."
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [team_id, session_id]
              config:
                severity: warn
