version: 2

# GA4's native BigQuery Export
# Only properties with is_stitchable = true in seeds/seed_ga4_payment_account_map.csv are listed here
sources:
  - name: "analytics_{{ env_var('GA4_PROPERTY_ID_OQG1') }}"
    database: "{{ target.project }}"
    schema: "analytics_{{ env_var('GA4_PROPERTY_ID_OQG1') }}"
    config:
      tags: [ "ga4", "bronze" ]
    tables:
      - name: "events_intraday_*"
        description: "Raw GA4 event export, wildcard-sharded by day (rolling ~22-day intraday buffer)."

  - name: "analytics_{{ env_var('GA4_PROPERTY_ID_QCIO') }}"
    database: "{{ target.project }}"
    schema: "analytics_{{ env_var('GA4_PROPERTY_ID_QCIO') }}"
