      - name: microsoft_ads_ad_performance
        description: >
          Hourly ad performance (impressions, clicks, spend, conversions, revenue, ad
          creative attributes) per Microsoft Ads account/campaign/ad group/ad. Grain:
          account_id x campaign_id x ad_group_id x ad_id x time_period -- one level
          deeper than microsoft_ads_ad_group_performance. Unsegmented totals, same
          exclusion logic as the other Microsoft Ads bronze tables -- see
