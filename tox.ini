# Run every check CI runs, locally:   tox            (all envs)
#                                     tox -e lint    (one env)
# Needs the Astro CLI + Docker for `pytest`, and gcloud auth for `dbt`.
[tox]
min_version = 4
skipsdist = true
env_list = lint, env, pytest, dbt

[testenv:lint]
description = ruff check + format check (same as the PR lint job)
skip_install = true
deps = ruff==0.17.3
commands =
    ruff check .
    ruff format --check .

[testenv:fix]
description = apply ruff fixes and formatting
skip_install = true
deps = ruff==0.17.3
commands =
    ruff check . --fix
    ruff format .

[testenv:env]
description = code's required env vars are set in .env.ci (add `-- --env-file dev=<file>` to check a deployment)
skip_install = true
commands = python scripts/check_env_vars.py --env-file ci=.env.ci {posargs}

[testenv:pytest]
description = DAG parse + pytest inside the Astro image with .env.ci, same as the PR airflow-validate job
skip_install = true
allowlist_externals = scripts/astro_pytest_ci.sh
commands = scripts/astro_pytest_ci.sh

[testenv:dbt]
description = dbt test (same as the PR dbt-test job) against the *_sandbox datasets from .env. Needs gcloud auth. Set ALLOW_PROD_DBT=1 to run against non-sandbox datasets
skip_install = true
deps = dbt-bigquery==1.11.3
allowlist_externals = scripts/dbt_test_local.sh
pass_env =
    DBT_*
    ALLOW_PROD_DBT
    GOOGLE_APPLICATION_CREDENTIALS
    CLOUDSDK_*
    HOME
commands = scripts/dbt_test_local.sh
